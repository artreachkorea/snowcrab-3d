<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>대게 바다 산책</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{--ink:#e8f3f1;--sub:#9fc3c4;--glass:rgba(8,36,44,.55);--line:rgba(160,210,210,.22);--accent:#f2a061}
  *{box-sizing:border-box;margin:0}
  html,body{height:100%;overflow:hidden;background:#0b2f3a;font-family:'IBM Plex Sans KR',system-ui,sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none;touch-action:none}
  canvas{display:block}
  .title{position:fixed;left:20px;top:18px;pointer-events:none}
  .title h1{font-size:20px;font-weight:600;letter-spacing:-.01em}
  .title p{font-size:13px;color:var(--sub);margin-top:2px}
  .keys{position:fixed;left:20px;bottom:20px;background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.75;backdrop-filter:blur(6px)}
  kbd{display:inline-block;min-width:22px;text-align:center;padding:0 5px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;font-family:inherit;font-size:12px;margin-right:2px;color:var(--ink)}
  .pad{position:fixed;inset:auto 0 18px 0;display:none;justify-content:space-between;align-items:flex-end;padding:0 18px;pointer-events:none}
  .dpad{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(2,56px);gap:6px;pointer-events:auto}
  .pad button{appearance:none;border:1px solid var(--line);background:var(--glass);color:var(--ink);border-radius:14px;font:600 14px 'IBM Plex Sans KR',sans-serif;backdrop-filter:blur(6px);touch-action:none}
  .pad button:active,.pad button.on{background:rgba(242,160,97,.35)}
  .side{display:flex;flex-direction:column;gap:8px;pointer-events:auto}
  .side .row{display:flex;gap:8px}
  .side button{width:56px;height:56px}
  .side .claw{width:120px;height:64px;background:rgba(242,160,97,.3)}
  @media (pointer:coarse){.keys{display:none}.pad{display:flex}}
  .loading{position:fixed;inset:0;display:grid;place-items:center;color:var(--sub);font-size:14px;transition:opacity .6s}
  @media (prefers-reduced-motion:reduce){.loading{transition:none}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head>
<body>
<div class="loading" id="loading">대게를 빚는 중…</div>
<div class="title"><h1>대게 바다 산책</h1><p>깊은 바다 모래 위를 걷는 Chionoecetes opilio</p></div>
<div class="keys">
  <div><kbd>A</kbd><kbd>D</kbd> 옆으로 걷기 (게걸음)</div>
  <div><kbd>W</kbd><kbd>S</kbd> 앞뒤로 걷기 &nbsp; <kbd>Q</kbd><kbd>E</kbd> 회전</div>
  <div>클릭 집게 딸깍 &nbsp; 드래그 회전 &nbsp; 휠 줌</div>
</div>
<div class="pad">
  <div class="dpad">
    <span></span><button data-k="w">앞</button><span></span>
    <button data-k="a">◀</button><button data-k="s">뒤</button><button data-k="d">▶</button>
  </div>
  <div class="side">
    <div class="row"><button data-k="q">⟲</button><button data-k="e">⟳</button></div>
    <button class="claw" id="clawBtn">집게</button>
  </div>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
// ================= SNOW CRAB CORE · 100% procedural =================
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
function hash3(x,y,z){const s=Math.sin(x*127.1+y*311.7+z*74.7)*43758.5453123;return s-Math.floor(s);}
function noise3(x,y,z){
  const ix=Math.floor(x),iy=Math.floor(y),iz=Math.floor(z);
  const fx=x-ix,fy=y-iy,fz=z-iz;
  const u=fx*fx*(3-2*fx),v=fy*fy*(3-2*fy),w=fz*fz*(3-2*fz);
  const L=(a,b,t)=>a+(b-a)*t, h=(a,b,c)=>hash3(ix+a,iy+b,iz+c);
  return L(L(L(h(0,0,0),h(1,0,0),u),L(h(0,1,0),h(1,1,0),u),v),
           L(L(h(0,0,1),h(1,0,1),u),L(h(0,1,1),h(1,1,1),u),v),w);
}
function fbm(x,y,z,o=4){let a=.5,f=1,s=0;for(let i=0;i<o;i++){s+=a*noise3(x*f,y*f,z*f);f*=2.03;a*=.5;}return s;}
const smooth=(a,b,x)=>{const t=Math.min(1,Math.max(0,(x-a)/(b-a)));return t*t*(3-2*t);};

const CRAB_PAL={
  dark:new THREE.Color('#6a240c'), mid:new THREE.Color('#b44a18'), light:new THREE.Color('#dc7a38'),
  cream:new THREE.Color('#efe0c4'), belly:new THREE.Color('#f5ebd8'), spot:new THREE.Color('#f7eddc'),
  membrane:new THREE.Color('#d8ae80'), tip:new THREE.Color('#2a1208')
};
const _c=new THREE.Color(), _c2=new THREE.Color();

function shellColor(out,x,y,z,ny,spot=0,dark=0){
  const v=fbm(x*3.1+11,y*3.1,z*3.1,3);
  _c2.copy(CRAB_PAL.dark).lerp(CRAB_PAL.mid,smooth(.22,.58,v)).lerp(CRAB_PAL.light,smooth(.58,.85,v)*.55);
  out.copy(CRAB_PAL.cream).lerp(_c2,smooth(-.45,.25,ny));
  if(spot>0) out.lerp(CRAB_PAL.spot,spot*smooth(-.2,.4,ny));
  if(dark>0) out.lerp(CRAB_PAL.tip,dark);
  return out;
}
function paint(g,fn){
  g.computeVertexNormals();
  const p=g.attributes.position,n=g.attributes.normal,col=new Float32Array(p.count*3);
  for(let i=0;i<p.count;i++){
    fn(_c,i,p.getX(i),p.getY(i),p.getZ(i),n.getX(i),n.getY(i),n.getZ(i));
    col[i*3]=_c.r;col[i*3+1]=_c.g;col[i*3+2]=_c.b;
  }
  g.setAttribute('color',new THREE.BufferAttribute(col,3));
  return g;
}

function makeBumpTexture(size=256){
  const c=document.createElement('canvas');c.width=c.height=size;const x=c.getContext('2d');
  const img=x.createImageData(size,size);
  for(let j=0;j<size;j++)for(let i=0;i<size;i++){
    const v=fbm(i/size*12,j/size*12,.5,4)*200+28,k=(j*size+i)*4;
    img.data[k]=img.data[k+1]=img.data[k+2]=v;img.data[k+3]=255;
  }
  x.putImageData(img,0,0);
  const r=mulberry32(5);
  for(let i=0;i<size*3;i++){
    const px=r()*size,py=r()*size,rad=.6+r()*2.2;
    const gr=x.createRadialGradient(px,py,0,px,py,rad);
    gr.addColorStop(0,'rgba(255,255,255,.9)');gr.addColorStop(1,'rgba(255,255,255,0)');
    x.fillStyle=gr;x.beginPath();x.arc(px,py,rad,0,7);x.fill();
  }
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(3,3);
  return t;
}
let _bumpTex=null;
function makeShellMaterial(o={}){
  _bumpTex=_bumpTex||makeBumpTexture();
  if(o.standard) return new THREE.MeshStandardMaterial({
    vertexColors:true,roughness:o.roughness??.5,metalness:o.metalness??.06,
    bumpMap:_bumpTex,bumpScale:o.bumpScale??1.4,envMapIntensity:o.envMapIntensity??1
  });
  return new THREE.MeshPhysicalMaterial({
    vertexColors:true,roughness:o.roughness??.56,metalness:0,
    clearcoat:o.clearcoat??.35,clearcoatRoughness:.42,
    bumpMap:_bumpTex,bumpScale:o.bumpScale??1.4
  });
}

// ---- leg / claw segment: length along +X, blade-like cross section ----
function segmentGeo(len,r0,r1,o={}){
  const rad=o.radial??14,hs=o.hseg??Math.max(5,Math.round(len*18)),flat=o.flat??.68,seed=o.seed??0;
  const g=new THREE.CylinderGeometry(1,1,1,rad,hs,false);
  const p=g.attributes.position;const T=new Float32Array(p.count);
  for(let i=0;i<p.count;i++){
    const cx=p.getX(i),cy=p.getY(i),cz=p.getZ(i);
    const t=cy+.5;
    let r=r0+(r1-r0)*Math.pow(t,o.taperPow??1);
    r*=1+(o.bulge??.12)*Math.sin(Math.PI*t);
    let Y=cx,Z=-cz;
    const radial=Math.hypot(Y,Z);
    if(radial>1e-4){
      let d=(fbm(t*len*9+seed,Y*3,Z*3,3)-.5)*.22;
      if(o.spines) d+=Math.pow(Math.max(0,Math.sin(t*o.spines*Math.PI*2)),10)*smooth(.55,.95,Y)*.32*(1-t*.5);
      Y*=1+d;Z*=1+d*.6;
    }
    p.setXYZ(i,t*len,Y*r,Z*r*flat);T[i]=t;
  }
  return paint(g,(c,i,x,y,z,nx,ny)=>{
    const spot=o.spots?smooth(.8,.86,noise3(x*34+seed,y*34,z*34))*.6:0;
    shellColor(c,x+seed,y,z,ny,spot,o.darkTip?smooth(.72,1,T[i])*.9:0);
  });
}
function knuckleGeo(r,flat=.75,seed=0){
  const g=new THREE.SphereGeometry(r,12,10);g.scale(1,1,flat);
  return paint(g,(c,i,x,y,z,nx,ny)=>{shellColor(c,x+seed,y,z,ny);c.lerp(CRAB_PAL.membrane,.55);});
}

// ---- carapace (dorsal shell) ----
function carapaceGeo(o){
  const g=new THREE.SphereGeometry(1,o.lowpoly?72:120,o.lowpoly?48:80);g.rotateX(Math.PI/2);
  const rnd=mulberry32(o.seed||3),tub=[];
  const N=o.lowpoly?260:420;
  for(let i=0;i<N;i++){
    const th=rnd()*Math.PI*2,y=Math.min(.98,Math.pow(rnd(),.75)*1.05-.1),rr=Math.sqrt(1-y*y);
    tub.push([rr*Math.cos(th),y,rr*Math.sin(th),.012+rnd()*.022,.025+rnd()*.03]);
  }
  const p=g.attributes.position,B=new Float32Array(p.count);
  for(let i=0;i<p.count;i++){
    const x=p.getX(i),y=p.getY(i),z=p.getZ(i);
    let b=0;
    for(const t of tub){const dx=x-t[0],dy=y-t[1],dz=z-t[2],d2=dx*dx+dy*dy+dz*dz,w2=t[4]*t[4];if(d2<w2*9)b+=t[3]*Math.exp(-d2/w2);}
    b*=smooth(-.12,.2,y);
    const n=(fbm(x*4+3,y*4,z*4,4)-.5)*.05;
    const groove=-.028*Math.exp(-Math.pow((Math.abs(z)-.3)/.06,2))*smooth(.15,.5,y)*smooth(-.6,-.2,x)*(1-smooth(.3,.62,x));
    const cross=-.022*Math.exp(-Math.pow((x+.05-.2*z*z)/.05,2))*smooth(.25,.6,y)*(1-smooth(.22,.38,Math.abs(z)));
    const ang=Math.atan2(z,x),rim=Math.exp(-Math.pow(y/.09,2));
    let r=1+b+n+groove+cross+rim*.04*Math.pow(Math.max(0,Math.sin(ang*15)),6);
    let X=x*r,Y=y*r,Z=z*r;
    Z*=1-.13*smooth(.2,1,X);X*=.94;
    Y*=Y>0?.5*(1-.18*z*z):.25;
    if(x>.7){const h=Math.exp(-Math.pow((Math.abs(z)-.075)/.045,2))*smooth(.86,1,x)*smooth(-.25,.05,y)*(1-smooth(.1,.4,y));X+=.11*h;Y+=.015*h;}
    p.setXYZ(i,X,Y,Z);B[i]=b;
  }
  return paint(g,(c,i,x,y,z,nx,ny)=>{
    shellColor(c,x,y,z,ny,smooth(.018,.034,B[i])*.55);
    if(ny>.2) c.multiplyScalar(1-.18*smooth(-.01,-.03,(fbm(x*4+3,y*4,z*4,2)-.5)*.05-.0));
  });
}

function bellyGeo(lowpoly){
  const g=new THREE.SphereGeometry(1,lowpoly?40:64,lowpoly?28:40);
  const p=g.attributes.position;
  for(let i=0;i<p.count;i++){const x=p.getX(i),y=p.getY(i),z=p.getZ(i);p.setXYZ(i,x*.8,y*(y>0?.18:.22),z*.84);}
  return paint(g,(c,i,x,y,z,nx,ny)=>{
    c.copy(CRAB_PAL.belly).lerp(CRAB_PAL.cream,fbm(x*6,y*6,z*6,2));
    const line=Math.pow(Math.abs(Math.sin(x*10)),10)*smooth(.1,.5,-ny);
    c.lerp(CRAB_PAL.membrane,line*.6);
    const mid=Math.exp(-Math.pow(z/.025,2))*smooth(.2,.6,-ny);c.lerp(CRAB_PAL.membrane,mid*.5);
  });
}
function abdomenGeo(){
  const s=new THREE.Shape();
  s.moveTo(-.62,0);s.bezierCurveTo(-.62,.16,-.45,.2,-.3,.18);s.lineTo(.22,.06);
  s.quadraticCurveTo(.3,0,.22,-.06);s.lineTo(-.3,-.18);s.bezierCurveTo(-.45,-.2,-.62,-.16,-.62,0);
  const g=new THREE.ExtrudeGeometry(s,{depth:.02,bevelEnabled:true,bevelThickness:.02,bevelSize:.02,bevelSegments:3,curveSegments:16});
  return paint(g,(c,i,x,y,z)=>{
    c.copy(CRAB_PAL.belly);
    const seg=Math.pow(Math.abs(Math.sin((x+.62)*15)),14);c.lerp(CRAB_PAL.membrane,seg*.5);
    c.lerp(CRAB_PAL.light,smooth(.12,.2,Math.abs(y))*.25);
  });
}
function tintedGeo(g,tint=0){return paint(g,(c,i,x,y,z,nx,ny)=>{shellColor(c,x,y,z,ny);if(tint)c.lerp(CRAB_PAL.cream,tint);});}

// ---- limbs ----
function buildLimb(mat,defs,seed,lowpoly){
  const root=new THREE.Group(),joints=[],meshes=[];
  let parent=root,prev=0;
  defs.forEach((d,k)=>{
    const j=new THREE.Group();j.position.x=prev;parent.add(j);
    const m=new THREE.Mesh(segmentGeo(d.len,d.r0,d.r1,{...d,seed:seed*7+k*13,radial:lowpoly?10:14}),mat);
    m.castShadow=m.receiveShadow=true;j.add(m);meshes.push(m);
    if(k>0){const kn=new THREE.Mesh(knuckleGeo(d.r0*.92,d.flat??.7,seed+k),mat);kn.castShadow=true;j.add(kn);meshes.push(kn);}
    joints.push(j);parent=j;prev=d.len;
  });
  const tip=new THREE.Object3D();tip.position.x=prev;parent.add(tip);
  return{root,joints,meshes,tip};
}

const LEG_DEF=[
  {x:.4, L:2.55,yaw:.62,r:.07},
  {x:.12,L:2.95,yaw:.2, r:.074},
  {x:-.16,L:2.85,yaw:-.22,r:.071},
  {x:-.42,L:2.3,yaw:-.7,r:.064}
];
const LEG_REST=[.12,.34,-.8,-.52,-.4];
const CLAW_REST={coxaZ:-.05,merusZ:.42,merusY:-.1,carpusY:1.0,carpusZ:-.28,palmY:.55,palmZ:-.3};

function createSnowCrab(opts={}){
  const low=!!opts.lowpoly;
  const base=makeShellMaterial(opts);
  const M=()=>opts.perPartMaterial?base.clone():base;
  const eyeMat=new THREE.MeshPhysicalMaterial({color:'#0e0805',roughness:.15,clearcoat:1,clearcoatRoughness:.05});
  const crab={root:new THREE.Group(),body:new THREE.Group(),legs:[],claws:[],parts:[],baseY:0,materials:[]};
  crab.root.add(crab.body);
  const tag=(obj,info)=>{obj.traverse(o=>{if(o.isMesh)o.userData.pick=info;});};

  // shell group: carapace + eyes + antennae
  const shellMat=M();crab.materials.push(shellMat);
  const shell=new THREE.Group();crab.body.add(shell);
  const cara=new THREE.Mesh(carapaceGeo({lowpoly:low,seed:opts.seed||3}),shellMat);
  cara.castShadow=cara.receiveShadow=true;shell.add(cara);
  for(const s of[1,-1]){
    const stalk=new THREE.Group();stalk.position.set(.86,.03,s*.12);stalk.rotation.set(0,-s*.45,.55);shell.add(stalk);
    const sm=new THREE.Mesh(segmentGeo(.13,.034,.03,{flat:.9,seed:s+20}),shellMat);sm.castShadow=true;stalk.add(sm);
    const eye=new THREE.Mesh(new THREE.SphereGeometry(.04,16,12),eyeMat);eye.position.x=.14;eye.scale.set(1.1,1,1);stalk.add(eye);
    const curve=new THREE.CatmullRomCurve3([new THREE.Vector3(.9,-.02,s*.04),new THREE.Vector3(1.0,.04,s*.06),new THREE.Vector3(1.1,.11,s*.11),new THREE.Vector3(1.18,.2,s*.19)]);
    const ant=new THREE.Mesh(tintedGeo(new THREE.TubeGeometry(curve,24,.008,5,false)),shellMat);shell.add(ant);
    const c2=new THREE.CatmullRomCurve3([new THREE.Vector3(.92,-.04,s*.02),new THREE.Vector3(1.02,0,s*.03),new THREE.Vector3(1.1,.06,s*.05)]);
    const anl=new THREE.Mesh(tintedGeo(new THREE.TubeGeometry(c2,10,.012,5,false),.3),shellMat);shell.add(anl);
    crab.eyes=(crab.eyes||[]).concat(stalk);crab.antennae=(crab.antennae||[]).concat(ant);
  }
  tag(shell,{kind:'shell'});
  crab.parts.push({key:'shell',name:'등껍질',obj:shell,mat:shellMat});

  // belly group
  const bellyMat=M();crab.materials.push(bellyMat);
  const belly=new THREE.Group();crab.body.add(belly);
  const bm=new THREE.Mesh(bellyGeo(low),bellyMat);bm.position.y=-.05;bm.castShadow=bm.receiveShadow=true;belly.add(bm);
  const ab=new THREE.Mesh(abdomenGeo(),bellyMat);ab.rotation.x=Math.PI/2;ab.position.set(-.1,-.25,0);ab.castShadow=true;belly.add(ab);
  crab.mouth=[];
  for(const s of[1,-1]){
    const mp=new THREE.Mesh(tintedGeo(new THREE.BoxGeometry(.13,.022,.06,4,1,2),.2),bellyMat);
    mp.geometry.translate(.065,0,0);mp.position.set(.58,-.13,s*.035);mp.rotation.set(0,s*.1,-.25);belly.add(mp);crab.mouth.push(mp);
  }
  tag(belly,{kind:'belly'});
  crab.parts.push({key:'belly',name:'배',obj:belly,mat:bellyMat});

  // walking legs
  for(const side of[1,-1]) LEG_DEF.forEach((d,i)=>{
    const L=d.L,r=d.r,mat=M();crab.materials.push(mat);
    const limb=buildLimb(mat,[
      {len:.17,r0:r*1.2,r1:r*1.1,bulge:.2,flat:.85},
      {len:L*.4,r0:r,r1:r*.9,spines:7,spots:true},
      {len:L*.13,r0:r*.88,r1:r*.8},
      {len:L*.29,r0:r*.8,r1:r*.6,spines:5,spots:true},
      {len:L*.2,r0:r*.58,r1:r*.03,bulge:.06,taperPow:.85,darkTip:true}
    ],i+(side>0?10:20),low);
    limb.root.position.set(d.x,-.1,side*(.8-Math.abs(d.x)*.28));
    limb.root.rotation.y=-side*(Math.PI/2-d.yaw);
    crab.body.add(limb.root);
    const leg={...limb,side,i,rest:{yaw:limb.root.rotation.y,z:LEG_REST.slice()},twitch:0,mat};
    leg.joints.forEach((j,k)=>j.rotation.z=leg.rest.z[k]);
    const key=(side>0?'R':'L')+(i+1);
    tag(limb.root,{kind:'leg',index:crab.legs.length,key});
    crab.legs.push(leg);
    crab.parts.push({key,name:(side>0?'오른쪽':'왼쪽')+' 다리 '+(i+1),obj:limb.root,mat,leg});
  });

  // claws (chelipeds)
  for(const side of[1,-1]){
    const mat=M();crab.materials.push(mat);
    const limb=buildLimb(mat,[
      {len:.14,r0:.09,r1:.085,bulge:.2,flat:.85},
      {len:.6,r0:.078,r1:.072,spines:6,spots:true},
      {len:.24,r0:.075,r1:.082,bulge:.2},
      {len:.42,r0:.084,r1:.076,bulge:.2,flat:.72,spots:true}
    ],side>0?40:50,low);
    const palm=limb.joints[3];
    const fixed=new THREE.Mesh(segmentGeo(.32,.048,.006,{flat:.8,bulge:.05,darkTip:true,seed:side*3+60}),mat);
    fixed.position.set(.42,-.022,0);fixed.rotation.z=-.08;fixed.castShadow=true;palm.add(fixed);
    const finger=new THREE.Group();finger.position.set(.41,.04,0);palm.add(finger);
    const fm=new THREE.Mesh(segmentGeo(.34,.042,.006,{flat:.8,bulge:.08,darkTip:true,seed:side*3+70}),mat);fm.castShadow=true;finger.add(fm);
    const fk=new THREE.Mesh(knuckleGeo(.04,.8,side+90),mat);finger.add(fk);
    limb.root.position.set(.62,-.12,side*.42);
    limb.root.rotation.y=-side*(Math.PI/2-1.15);
    crab.body.add(limb.root);
    const R=CLAW_REST,j=limb.joints;
    j[0].rotation.z=R.coxaZ;j[1].rotation.set(0,side*R.merusY,R.merusZ);
    j[2].rotation.set(0,side*R.carpusY,R.carpusZ);j[3].rotation.set(0,side*R.palmY,R.palmZ);
    const claw={...limb,side,finger,open:0,target:0,snap:0,mat,meshes:[...limb.meshes,fixed,fm,fk]};
    const key=side>0?'RC':'LC';
    tag(limb.root,{kind:'claw',index:crab.claws.length,key});
    crab.claws.push(claw);
    crab.parts.push({key,name:(side>0?'오른쪽':'왼쪽')+' 집게',obj:limb.root,mat,claw});
  }

  crab.parts.forEach(p=>{p.home=p.obj.position.clone();});

  crab.fitToGround=()=>{
    crab.body.position.y=0;crab.root.updateMatrixWorld(true);
    const v=new THREE.Vector3(),inv=crab.root.matrixWorld.clone().invert();let min=1e9;
    crab.legs.forEach(l=>{v.setFromMatrixPosition(l.tip.matrixWorld).applyMatrix4(inv);min=Math.min(min,v.y);});
    crab.baseY=-min+.01;crab.body.position.y=crab.baseY;
  };
  crab.fitToGround();

  const S={phase:0,amp:0,t:0,fwd:0,lat:0,turn:0};crab.gait=S;
  crab.update=(dt,inp={})=>{
    dt=Math.min(dt,.05);S.t+=dt;
    const k=Math.min(1,dt*5),f=inp.fwd||0,la=inp.lat||0,tu=inp.turn||0;
    S.fwd+=(f-S.fwd)*k;S.lat+=(la-S.lat)*k;S.turn+=(tu-S.turn)*k;
    const mag=Math.min(1,Math.hypot(f,la)+Math.abs(tu)*.7);
    S.amp+=(mag-S.amp)*Math.min(1,dt*4);
    S.phase+=dt*(1+7.5*S.amp);
    const A=S.amp;
    crab.legs.forEach(l=>{
      const off=((l.i+(l.side>0?0:1))%2)*Math.PI,ph=S.phase+off;
      const sw=Math.sin(ph),lift=Math.max(0,Math.cos(ph));
      const idle=Math.sin(S.t*1.3+l.i*1.7+l.side)*.025;
      const e=S.lat*l.side*sw;
      l.twitch=Math.max(0,l.twitch-dt*1.4);
      const tw=l.twitch>0?Math.sin(l.twitch*Math.PI)*Math.sin(S.t*18)*.5+Math.sin(l.twitch*Math.PI)*.35:0;
      l.root.rotation.y=l.rest.yaw+A*(l.side*S.fwd*.3*sw+S.turn*.22*sw);
      const z=l.rest.z,j=l.joints;
      j[0].rotation.z=z[0]+A*lift*.14+idle*.4+tw*.6;
      j[1].rotation.z=z[1]+A*(lift*.3+e*.12)+idle+tw*.3;
      j[2].rotation.z=z[2]+A*e*.32-idle*.5;
      j[3].rotation.z=z[3]+A*e*.16+tw*.4;
      j[4].rotation.z=z[4]-A*lift*.18+idle*.6+tw*.5*Math.sin(S.t*22);
    });
    crab.claws.forEach((c,ci)=>{
      c.snap=Math.max(0,c.snap-dt*2.2);
      let tgt=c.target;if(c.snap>0)tgt=Math.sin(c.snap*Math.PI*2)>0?1:0;
      c.open+=(tgt-c.open)*Math.min(1,dt*14);
      c.finger.rotation.z=-.02+c.open*.7;
      const sway=Math.sin(S.t*1.1+ci*2)*.04+A*Math.sin(S.phase+ci*Math.PI)*.08;
      c.joints[1].rotation.z=CLAW_REST.merusZ+sway+c.open*.18;
      c.joints[3].rotation.z=CLAW_REST.palmZ-sway*.6-c.open*.12;
    });
    crab.body.position.y=crab.baseY+A*.03*Math.sin(S.phase*2)+.006*Math.sin(S.t*1.7);
    crab.body.rotation.x=A*.025*Math.sin(S.phase)*Math.sign(S.lat||1);
    crab.body.rotation.z=.01*Math.sin(S.t*.9)+A*.02*Math.sin(S.phase*2+1);
    crab.antennae.forEach((a,i)=>{a.rotation.y=Math.sin(S.t*2.3+i*1.4)*.08;a.rotation.x=Math.sin(S.t*1.7+i)*.05;});
    crab.eyes.forEach((e,i)=>{e.rotation.x=Math.sin(S.t*.7+i*3)*.06;});
    crab.mouth.forEach((m,i)=>{m.rotation.y=(i?-1:1)*(.1+Math.max(0,Math.sin(S.t*6+i))*.12);});
  };
  crab.snapClaws=(idx)=>{(idx==null?crab.claws:[crab.claws[idx]]).forEach(c=>c.snap=1);};
  return crab;
}

const mobile=matchMedia('(pointer:coarse)').matches||innerWidth<700;
const renderer=new THREE.WebGLRenderer({antialias:!mobile,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,mobile?1.5:1.75));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
document.body.prepend(renderer.domElement);

const scene=new THREE.Scene();
const SEA=new THREE.Color('#145262');
scene.background=SEA;scene.fog=new THREE.FogExp2(SEA,.055);
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,120);
camera.position.set(5.5,4.2,6.5);
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.minDistance=3;controls.maxDistance=18;controls.maxPolarAngle=1.45;controls.target.set(0,.5,0);

// light: sun filtering through water
scene.add(new THREE.HemisphereLight('#9fd8e0','#5b4a32',.9));
const sun=new THREE.DirectionalLight('#fff1dc',2.6);
sun.position.set(4,10,3);sun.castShadow=true;
sun.shadow.mapSize.set(mobile?1024:2048,mobile?1024:2048);
Object.assign(sun.shadow.camera,{left:-6,right:6,top:6,bottom:-6,near:1,far:30});
sun.shadow.bias=-.0004;sun.shadow.normalBias=.025;sun.shadow.radius=4;
scene.add(sun,sun.target);

// sand floor
function sandTex(){
  const s=256,c=document.createElement('canvas');c.width=c.height=s;const x=c.getContext('2d'),img=x.createImageData(s,s);
  for(let j=0;j<s;j++)for(let i=0;i<s;i++){
    const ripple=Math.sin((i*.9+Math.sin(j*.05)*12)*.18)*.5+.5,n=fbm(i*.06,j*.06,1.3,4),g=hash3(i,j,7);
    const v=.55+n*.35+ripple*.1+g*.08,k=(j*s+i)*4;
    img.data[k]=196*v;img.data[k+1]=178*v;img.data[k+2]=140*v;img.data[k+3]=255;
  }
  x.putImageData(img,0,0);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(14,14);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=4;return t;
}
const sand=sandTex();
const floorGeo=new THREE.PlaneGeometry(80,80,mobile?80:140,mobile?80:140);floorGeo.rotateX(-Math.PI/2);
{const p=floorGeo.attributes.position;for(let i=0;i<p.count;i++){const x=p.getX(i),z=p.getZ(i),d=Math.hypot(x,z);p.setY(i,(fbm(x*.15,z*.15,2,3)-.5)*.9*smooth(4,12,d));}floorGeo.computeVertexNormals();}
const floor=new THREE.Mesh(floorGeo,new THREE.MeshStandardMaterial({map:sand,bumpMap:sand,bumpScale:2,roughness:.95}));
floor.receiveShadow=true;scene.add(floor);

// caustics overlay
function causticTex(){
  const s=256,c=document.createElement('canvas');c.width=c.height=s;const x=c.getContext('2d'),img=x.createImageData(s,s);
  const r=mulberry32(11),pts=[];for(let i=0;i<22;i++)pts.push([r()*s,r()*s]);
  for(let j=0;j<s;j++)for(let i=0;i<s;i++){
    let f1=1e9,f2=1e9;
    for(const[px,py]of pts)for(let ox=-1;ox<=1;ox++)for(let oy=-1;oy<=1;oy++){const d=Math.hypot(i-px-ox*s,j-py-oy*s);if(d<f1){f2=f1;f1=d;}else if(d<f2)f2=d;}
    const v=Math.pow(1-smooth(0,10,f2-f1),2.2)*255,k=(j*s+i)*4;
    img.data[k]=v*.85;img.data[k+1]=v;img.data[k+2]=v*.95;img.data[k+3]=255;
  }
  x.putImageData(img,0,0);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(18,18);return t;
}
const cTex=causticTex(),cTex2=cTex.clone();cTex2.repeat.set(13,13);
const causticMat=(t,o)=>new THREE.MeshBasicMaterial({map:t,transparent:true,opacity:o,blending:THREE.AdditiveBlending,depthWrite:false,fog:true});
const caustics=[new THREE.Mesh(floorGeo,causticMat(cTex,.13)),new THREE.Mesh(floorGeo,causticMat(cTex2,.09))];
caustics.forEach((m,i)=>{m.position.y=.012+i*.004;m.renderOrder=1;scene.add(m);});

// rocks
const rockMat=new THREE.MeshStandardMaterial({vertexColors:true,roughness:.9,flatShading:true});
const rr=mulberry32(4);
for(let i=0;i<16;i++){
  const g=new THREE.IcosahedronGeometry(1,2),p=g.attributes.position,sd=rr()*50;
  for(let k=0;k<p.count;k++){const v=new THREE.Vector3().fromBufferAttribute(p,k);v.multiplyScalar(.75+fbm(v.x*1.4+sd,v.y*1.4,v.z*1.4,3)*.6);p.setXYZ(k,v.x,v.y,v.z);}
  paint(g,(c,k,x,y,z,nx,ny)=>{c.set('#4a5550').lerp(new THREE.Color('#6b7a5c'),smooth(.3,.9,ny)*fbm(x*3,y*3,z*3,2)*1.4);});
  const m=new THREE.Mesh(g,rockMat),a=rr()*Math.PI*2,d=5+rr()*16,s=.3+rr()*1.3;
  m.position.set(Math.cos(a)*d,s*.2,Math.sin(a)*d);m.scale.set(s,s*(.5+rr()*.4),s*(.8+rr()*.5));m.rotation.y=rr()*6;
  m.castShadow=m.receiveShadow=true;scene.add(m);
}

// marine snow
const snowN=mobile?350:800,sp=new Float32Array(snowN*3);
for(let i=0;i<snowN;i++){sp[i*3]=(Math.random()-.5)*30;sp[i*3+1]=Math.random()*10;sp[i*3+2]=(Math.random()-.5)*30;}
const snowGeo=new THREE.BufferGeometry();snowGeo.setAttribute('position',new THREE.BufferAttribute(sp,3));
const snow=new THREE.Points(snowGeo,new THREE.PointsMaterial({color:'#d8f0ee',size:.035,transparent:true,opacity:.55,depthWrite:false}));
scene.add(snow);

// crab
const crab=createSnowCrab({lowpoly:mobile});
scene.add(crab.root);
document.getElementById('loading').style.opacity=0;
setTimeout(()=>document.getElementById('loading').remove(),700);

// input
const keys=new Set();
addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys.add(k);if(k===' ')crab.snapClaws();});
addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
addEventListener('blur',()=>keys.clear());
document.querySelectorAll('.pad [data-k]').forEach(b=>{
  const k=b.dataset.k,on=e=>{e.preventDefault();keys.add(k);b.classList.add('on');},off=()=>{keys.delete(k);b.classList.remove('on');};
  b.addEventListener('pointerdown',on);['pointerup','pointercancel','pointerleave'].forEach(t=>b.addEventListener(t,off));
});
document.getElementById('clawBtn').addEventListener('pointerdown',e=>{e.preventDefault();crab.snapClaws();});

const ray=new THREE.Raycaster(),ptr=new THREE.Vector2();let down=null;
renderer.domElement.addEventListener('pointerdown',e=>down=[e.clientX,e.clientY]);
renderer.domElement.addEventListener('pointerup',e=>{
  if(!down||Math.hypot(e.clientX-down[0],e.clientY-down[1])>6)return;
  ptr.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(ptr,camera);
  const hit=ray.intersectObject(crab.root,true)[0];
  if(hit&&hit.object.userData.pick?.kind==='claw')crab.snapClaws(hit.object.userData.pick.index);
  else crab.snapClaws();
});

// loop
const clock=new THREE.Clock(),prev=new THREE.Vector3(),delta=new THREE.Vector3();
let heading=0;
function tick(){
  const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
  const fwd=(keys.has('w')||keys.has('arrowup')?1:0)-(keys.has('s')||keys.has('arrowdown')?1:0);
  const lat=(keys.has('d')||keys.has('arrowright')?1:0)-(keys.has('a')||keys.has('arrowleft')?1:0);
  const turn=(keys.has('q')?1:0)-(keys.has('e')?1:0);
  crab.update(dt,{fwd,lat,turn});
  const g=crab.gait;
  heading+=g.turn*dt*.9;crab.root.rotation.y=heading;
  prev.copy(crab.root.position);
  const vx=g.fwd*.55,vz=g.lat*1.05;
  crab.root.position.x+=(Math.cos(heading)*vx+Math.sin(heading)*vz)*dt;
  crab.root.position.z+=(-Math.sin(heading)*vx+Math.cos(heading)*vz)*dt;
  const r=Math.hypot(crab.root.position.x,crab.root.position.z);if(r>22)crab.root.position.multiplyScalar(22/r);
  delta.subVectors(crab.root.position,prev);camera.position.add(delta);controls.target.add(delta);
  sun.position.set(crab.root.position.x+4,10,crab.root.position.z+3);sun.target.position.copy(crab.root.position);
  cTex.offset.set(t*.012,t*.008);cTex2.offset.set(-t*.009,t*.011);
  const p=snowGeo.attributes.position;for(let i=0;i<snowN;i++){let y=p.getY(i)-dt*.08;if(y<0)y=10;p.setY(i,y);p.setX(i,p.getX(i)+Math.sin(t*.3+i)*dt*.02);}p.needsUpdate=true;
  controls.update();renderer.render(scene,camera);requestAnimationFrame(tick);
}
tick();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
